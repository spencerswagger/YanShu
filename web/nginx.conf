# 雁书 前端站点（单端口：静态站点 + API 反代）
#
# 前端请求的 API 前缀（从 web/src 全量 grep，nginx 必须覆盖，漏一个就 404）：
#   /v1/config
#   /v1/codes            /v1/codes/{code}          （GET 查询 / PATCH 昵称）
#   /v1/challenges                                 （POST 取签名挑战）
#   /v1/transfers                                  （POST 创建传输）
#   /v1/transfers/{id}                             （GET 状态）
#   /v1/transfers/{id}/status
#   /v1/transfers/{id}/prelude                     （PUT 上传 / GET 下载）
#   /v1/transfers/{id}/chunks/{index}              （PUT 上传 / GET 下载 / HEAD 探测）
#   /v1/transfers/{id}/complete
#   /v1/transfers/{id}/ack
#   /v1/transfers/{id}/revoke
#   /v1/inbox?since=...
#   /v1/ws                                         （v1 未启用，预留 Upgrade 反代）
#   /healthz                                       （服务端健康检查，直通）
# 以上全部落在 /v1/ 与 /healthz 两条规则内；新增前缀必须同步改本文件。

upstream yanshu_api {
    server yanshu-server:8080;
    keepalive 16;
}

# 前端与 API 同源：CSP 里的 connect-src 只需 'self'
# X-Forwarded-For 透传策略：
#   服务端取 XFF 的**第一跳（最左）**；本层若用 $proxy_add_x_forwarded_for 追加，
#   会把上游（外层反代）写的真实客户端 IP 挤到后面，服务端就取不到了。
#   因此：上游给了 XFF 就原样透传；没有（直连本层）则用 $remote_addr。
map $http_x_forwarded_for $ys_xff {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# WebSocket：v1 未启用（/v1/ws 只是 503 占位）。真启用时这组 map 与三行 proxy_set_header 才有意义；
# map 必须在 http {} 层（本文件由 conf.d include，位于 http 上下文）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传块默认 1 MiB；给到 32 MiB 余量（分块接口不走 multipart）
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    server_tokens off;

    # ---- 安全头（meta 里的 frame-ancestors 会被浏览器忽略，必须在这里下发）----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # ---- 静态健康检查（容器 HEALTHCHECK 用，不打到 API）----
    location = /healthz-static {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---- 服务端健康检查：直通 ----
    location = /healthz {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://yanshu_api/healthz;
        proxy_read_timeout 5s;
    }

    # ---- WebSocket 预留（v1 前端未连接；开了也不 404）----
    location /v1/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $ys_xff;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://yanshu_api;
    }

    # ---- API 反代（保留原始路径：/v1/... 原样转给服务端）----
    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 服务端 YANSHU_TRUST_PROXY=true 时按 X-Forwarded-For 取客户端 IP（限速/审计用）；
        # 不设该变量时服务端忽略此头，只认直连地址。
        proxy_set_header X-Forwarded-For $ys_xff;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 大块上传：不落临时文件、不缓冲请求体，直接透传
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://yanshu_api;
    }

    # ---- 端侧内核 wasm：必须给正确的 MIME，且换内核后要立刻生效 ----
    location = /ys_kernel.wasm {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ---- 构建产物（文件名带 hash）：长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- 入口 HTML 与溯源文件：不缓存，保证换版本立刻生效 ----
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /ys_kernel.build.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ---- SPA fallback（前端没有 vue-router，单页 + 内部状态；留着以防将来加路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
