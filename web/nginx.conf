# 雁书前端静态站 + API 反代（单端口对外）
#
# - `/`            静态资源（Vue 构建产物），SPA 路由回落到 index.html
# - `/v1/`         反代到服务端容器 yanshu-server:8080
# - `/healthz`     反代到服务端（诊断入口，仍返回 200）
# - `.wasm`        WebAssembly MIME，避免浏览器拒绝编译
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传块默认 1 MiB，prelude 上限 4 MiB；留余量
    client_max_body_size 16m;

    # 诊断入口：直接透传到服务端，成功仍是 200
    location = /healthz {
        proxy_pass http://yanshu-server:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 反代（/v1 前缀整体转发）
    location /v1/ {
        proxy_pass http://yanshu-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 端侧内核（真 WASM 加密）
    location = /ys_kernel.wasm {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 静态资源：SPA 回落
    location / {
        try_files $uri $uri/ /index.html;
    }
}
