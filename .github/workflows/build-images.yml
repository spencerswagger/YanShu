name: build-images

# 触发：
#   - push tag vX.Y.Z（预发布如 v1.2.3-rc1 不打 latest）
#   - 手动触发：打 <short-sha> 与 latest
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: swr.cn-east-5.myhuaweicloud.com
  NAMESPACE: spencerswagger
  PLATFORMS: linux/amd64
  # 前端基础镜像（SWR tag 待确认；不存在时在仓库变量/此处替换，不回退 Docker Hub）

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yanshu-server
            context: ./server
            dockerfile: ./server/Dockerfile
          - name: yanshu-web
            # 前端需要端侧内核 ys_kernel.wasm（server/kernel/），因此上下文是仓库根
            context: .
            dockerfile: ./web/Dockerfile
            # SWR 上的基础镜像 tag 待目标环境确认；可用 workflow env 覆盖
            # 注意：strategy.matrix 里不能用 ${{ env.X }}（GitHub 解析期报 Unrecognized named-value: 'env'），
            # 这里必须写字面量；镜像 tag 已核对 SWR 上确实存在。
            build-args: |
              NODE_IMAGE=swr.cn-east-5.myhuaweicloud.com/spencerswagger/library-node:22-alpine
              NGINX_IMAGE=swr.cn-east-5.myhuaweicloud.com/spencerswagger/library-nginx:alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -eu
          ref="${GITHUB_REF_TYPE:-}"
          name="${GITHUB_REF_NAME:-}"
          short="$(git rev-parse --short=7 HEAD)"
          tags=""
          if [ "$ref" = "tag" ]; then
            tags="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:${name}"
            # 预发布 tag（例如 v1.0.0-rc1）不打 latest
            case "$name" in
              *-*) ;;
              *) tags="${tags},${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:latest" ;;
            esac
          else
            tags="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:${short},${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "resolved tags: ${tags}"

      - name: Check registry credentials
        id: creds
        env:
          SWR_USERNAME: ${{ secrets.SWR_USERNAME || secrets.DOCKER_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD || secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${SWR_USERNAME}" ] && [ -n "${SWR_PASSWORD}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SWR_USERNAME/SWR_PASSWORD（或兼容名 DOCKER_USERNAME/DOCKER_PASSWORD）未配置，降级为只构建不推送"
          fi

      - name: Set up QEMU
        if: contains(env.PLATFORMS, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.creds.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.push }}" = "true" ]; then
            echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 已构建并**推送**：\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **未推送**（缺少 SWR_USERNAME/SWR_PASSWORD（兼容名 DOCKER_USERNAME/DOCKER_PASSWORD））：仅完成构建，镜像未上传注册表" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute kernel sha256 (build-time, no hardcoded value)
        id: kernel
        if: matrix.name == 'yanshu-web'
        run: |
          set -eu
          CALC="$(sha256sum server/kernel/yanshu_sm.wasm | cut -d' ' -f1)"
          BYTES="$(wc -c < server/kernel/yanshu_sm.wasm | tr -d ' ')"
          echo "sha256=${CALC}" >> "$GITHUB_OUTPUT"
          echo "bytes=${BYTES}" >> "$GITHUB_OUTPUT"
          echo "[kernel] computed at build time: sha256=${CALC} bytes=${BYTES}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.creds.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.build-args }}
            ${{ matrix.name == 'yanshu-web' && format('YS_KERNEL_SHA={0}', steps.kernel.outputs.sha256) || '' }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
