name: build-images

# 触发：
#   - push tag vX.Y.Z（预发布如 v1.2.3-rc1 不打 latest）
#   - 手动触发：打 <short-sha> 与 latest
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: swr.cn-east-5.myhuaweicloud.com
  NAMESPACE: spencerswagger
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yanshu-server
            context: ./server
            dockerfile: ./server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -eu
          ref="${GITHUB_REF_TYPE:-}"
          name="${GITHUB_REF_NAME:-}"
          short="$(git rev-parse --short=7 HEAD)"
          tags=""
          if [ "$ref" = "tag" ]; then
            tags="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:${name}"
            # 预发布 tag（例如 v1.0.0-rc1）不打 latest
            case "$name" in
              *-*) ;;
              *) tags="${tags},${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:latest" ;;
            esac
          else
            tags="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:${short},${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "resolved tags: ${tags}"

      - name: Check registry credentials
        id: creds
        env:
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          if [ -n "${SWR_USERNAME}" ] && [ -n "${SWR_PASSWORD}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SWR_USERNAME/SWR_PASSWORD 未配置，降级为只构建不推送"
          fi

      - name: Set up QEMU
        if: contains(env.PLATFORMS, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.creds.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.push }}" = "true" ]; then
            echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 已构建并**推送**：\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **未推送**（缺少 SWR_USERNAME/SWR_PASSWORD）：仅完成构建，镜像未上传注册表" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.creds.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
