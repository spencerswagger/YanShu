# 雁书服务端 + PostgreSQL（v1 单实例）—— 零配置部署
#
#   mkdir yanshu && cd yanshu
#   curl -O https://raw.githubusercontent.com/spencerswagger/YanShu/main/docker-compose.yml
#   docker compose up -d
#
# 首次启动会在当前目录 ./secrets/ 下自动生成 token_secret 与 pg_password（0600），**别删**；
# 重启用同一份密钥；想彻底重来用 `docker compose down -v` 再删 ./secrets。
# 默认使用已发布版本 v0.2.3（可覆盖：YANSHU_IMAGE_TAG=v0.2.3 / latest；回滚填 v0.2.2）。端口同理：YANSHU_PORT=8000 docker compose up -d
#
# 所有镜像均取自国内源（华为云 SWR），无需外网 Docker Hub。
# 开发（改代码后重新构建）：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  # 一次性：生成密钥（不存在时）+ 修数据卷属主（业务进程以 10001 运行，写不了 root 卷）
  init:
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/library-alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /secrets
        # 一律用十六进制：base64 可能含 '/' 或 '+'，会把 DSN 解析打断（invalid port）
        [ -s /secrets/token_secret ] || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /secrets/token_secret
        [ -s /secrets/pg_password ] || od -An -tx1 -N24 /dev/urandom | tr -d ' \n' > /secrets/pg_password
        # 密钥由业务容器的运行用户（10001）读取；postgres 以 root 读，不受影响
        chown 10001:10001 /secrets/token_secret /secrets/pg_password
        chmod 600 /secrets/token_secret /secrets/pg_password
        chmod 755 /secrets
        chown -R 10001:10001 /data/blobs /data/logs
        echo "[init] ./secrets 已就绪，数据卷属主已修正"
    volumes:
      - ./secrets:/secrets
      - blobdata:/data/blobs
      - logdata:/data/logs
    restart: "no"

  postgres:
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/library-postgres:16-alpine
    environment:
      POSTGRES_USER: yanshu
      POSTGRES_DB: yanshu
      POSTGRES_PASSWORD_FILE: /secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanshu -d yanshu"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  yanshu-server:
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/yanshu-server:${YANSHU_IMAGE_TAG:-v0.2.3}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # 密钥从 ./secrets 读入环境变量后再启动（用户无需写任何 .env）
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        YANSHU_TOKEN_SECRET="$$(cat /secrets/token_secret)"; export YANSHU_TOKEN_SECRET
        # 口令做 URL 编码再拼 DSN：老版本可能生成过含 '/' 或 '+' 的口令（base64），
        # 不编码会把 DSN 截断成 invalid port —— 编码后老部署无需删数据即可恢复。
        PG_PW_ENC="$$(sed 's|%|%25|g; s|/|%2F|g; s|@|%40|g; s|:|%3A|g; s|+|%2B|g' /secrets/pg_password)"
        YANSHU_DATABASE_URL="postgres://yanshu:$${PG_PW_ENC}@postgres:5432/yanshu?sslmode=disable"; export YANSHU_DATABASE_URL
        /app/yanshu-server -migrate-only
        exec /app/yanshu-server
    environment:
      YANSHU_TOKEN_EPOCH: ${YANSHU_TOKEN_EPOCH:-1}
      YANSHU_VERIFIER: ${YANSHU_VERIFIER:-sm2}
      YANSHU_KERNEL_WASM: /app/kernel/yanshu_sm.wasm
      YANSHU_BLOB_DIR: /app/data/blobs
      YANSHU_LOG_DIR: /app/data/logs
      YANSHU_ADDR: 0.0.0.0:8080
      YANSHU_ENV: ${YANSHU_ENV:-production}
      YANSHU_STORAGE_QUOTA_BYTES: ${YANSHU_STORAGE_QUOTA_BYTES:-8589934592}
    # 不对外发布端口：只由 web 容器在内部网络访问
    volumes:
      - blobdata:/app/data/blobs
      - logdata:/app/data/logs
      - ./secrets:/secrets:ro
    restart: unless-stopped

  web:
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/yanshu-web:${YANSHU_IMAGE_TAG:-v0.2.3}
    depends_on:
      yanshu-server:
        condition: service_healthy
    ports:
      # 唯一对外端口：界面 + /v1 反代 + /healthz 直通
      - "${YANSHU_PORT:-18080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  blobdata:
  logdata:
