# 雁书服务端 + PostgreSQL（v1 单实例，零配置）
#
# 部署（只需下载本文件）：
#   mkdir yanshu && cd yanshu
#   curl -O https://raw.githubusercontent.com/spencerswagger/YanShu/main/docker-compose.yml
#   docker compose up -d
#
# 首次启动会在 ./secrets/ 生成密钥（token_secret / pg_password），之后复用，切勿删除。
# `down -v` 会删数据卷，下次启动视为全新部署并重新生成密钥。
#
# 本地改代码后再起（开发）：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 说明：
#   - 容器内必须监听 0.0.0.0 才能映射端口；stub-allow 有 loopback 门禁，
#     因此默认用 sm2（真验签）。
#   - 限速额度是进程内实现：v1 只支持单实例。

services:
  # 一次性任务：生成/复用密钥 + 修正数据卷属主。跑完即退出，退出码 0。
  init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /secrets
        chmod 700 /secrets
        # pgdata 为空 = 全新部署（含 down -v 之后）；此时重建密钥，否则一律复用
        if [ -z "$$(ls -A /pgdata 2>/dev/null || true)" ]; then
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /secrets/token_secret
          head -c 24 /dev/urandom | base64 | tr -d '\n' > /secrets/pg_password
          echo "init: fresh database detected, generated new secrets in /secrets" >&2
        else
          if [ ! -s /secrets/token_secret ] || [ ! -s /secrets/pg_password ]; then
            echo "init: database exists but secrets missing; restore ./secrets or wipe data with 'down -v'" >&2
            exit 1
          fi
          echo "init: reusing existing secrets (database already initialized)" >&2
        fi
        chmod 600 /secrets/token_secret /secrets/pg_password
        chown -R 10001:10001 /data/blobs /data/logs
    volumes:
      - ./secrets:/secrets
      - pgdata:/pgdata
      - blobdata:/data/blobs
      - logdata:/data/logs
    restart: "no"

  postgres:
    # SWR 同步完成后可直接用这一行；拉不到时临时换成 postgres:16-alpine
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/library-postgres:16-alpine
    environment:
      POSTGRES_USER: yanshu
      POSTGRES_DB: yanshu
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanshu -d yanshu"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  yanshu-server:
    image: swr.cn-east-5.myhuaweicloud.com/spencerswagger/yanshu-server:${YANSHU_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      YANSHU_TOKEN_EPOCH: ${YANSHU_TOKEN_EPOCH:-1}
      YANSHU_VERIFIER: ${YANSHU_VERIFIER:-sm2}
      YANSHU_KERNEL_WASM: /app/kernel/yanshu_sm.wasm
      YANSHU_BLOB_DIR: /app/data/blobs
      YANSHU_LOG_DIR: /app/data/logs
      YANSHU_ADDR: 0.0.0.0:8080
      YANSHU_ENV: ${YANSHU_ENV:-production}
      YANSHU_STORAGE_QUOTA_BYTES: ${YANSHU_STORAGE_QUOTA_BYTES:-8589934592}
    ports:
      - "${YANSHU_PORT:-18080}:8080"
    volumes:
      - ./secrets:/run/secrets:ro
      - blobdata:/app/data/blobs
      - logdata:/app/data/logs
    restart: unless-stopped

volumes:
  pgdata:
  blobdata:
  logdata:
